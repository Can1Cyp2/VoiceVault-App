<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f1a" />
    <meta http-equiv="refresh" content="0; url=/VoiceVault-App/" />
    <link rel="icon" type="image/png" href="/VoiceVault-App/voicevault-icon.png" />
    <link rel="apple-touch-icon" href="/VoiceVault-App/voicevault-icon.png" />
    <title>Opening VoiceVault</title>
    <script>
      window.location.replace("/VoiceVault-App/");
    </script>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #0a0f1a;
        color: #f0f0f0;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background:
          radial-gradient(circle at 50% 0%, rgba(255, 107, 82, 0.16), transparent 32rem),
          linear-gradient(180deg, #0a0f1a 0%, #111827 52%, #0f1419 100%);
      }

      main {
        width: min(420px, calc(100% - 32px));
        text-align: center;
      }

      img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        box-shadow: 0 0 52px rgba(255, 102, 0, 0.4);
      }

      h1 {
        margin: 22px 0 10px;
        font-size: 1.8rem;
        line-height: 1.15;
      }

      p {
        margin: 0 0 22px;
        color: #c5c5c5;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 0 18px;
        border-radius: 8px;
        background: linear-gradient(180deg, #ff7733, #ff6347);
        color: #ffffff;
        font-weight: 900;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/VoiceVault-App/voicevault-icon.png" alt="VoiceVault" />
      <h1>Opening VoiceVault</h1>
      <p>Taking you back to the download screen.</p>
      <a href="/VoiceVault-App/">Open VoiceVault download page</a>
    </main>
  </body>
</html>
